[hypothesis]
title = "经营利润与净利润的分歧"
question = "经营利润增长而净利润下降时，比较期税项解释了多少差异？汇率、云业务与个人计算业务分别提供了什么证据？"
threshold_policy = "same_fixed_goal_for_all_grid_cases"

[checks]
accounting = ["将上年同期一次性税项与本期经营利润分开，核对 GAAP 与调整后比较数。", "分开记录报告汇率和固定汇率增长，不能混成同一时间序列。", "查阅折旧估计与租赁附注，分别记录设备购置、融资租赁与折旧费用。"]
point_in_time = ["不能从后续年报回填尚未公开的全年会计估计影响。"]
execution = ["核对股息资格与支付日；回购金额不等于交易账户收到现金。"]
automation_status = "review_requirements_not_all_implemented_as_scores"

[[evidence]]
phase = "before_start"
publication_date = "2022-10-25"
url = "https://www.microsoft.com/en-us/Investor/earnings/FY-2023-Q1/press-release-webcast"
report_label = "FY2023 Q1"
reviewer = "Codex"
review_scope = "publication_date_and_selected_accounting_items"
