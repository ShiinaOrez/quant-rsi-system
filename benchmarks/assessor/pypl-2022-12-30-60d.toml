[hypothesis]
title = "投资收益与支付经营"
question = "GAAP 每股收益高于 non-GAAP 时，战略投资收益和经营利润各自贡献什么？TPV 增长如何传导至收入、交易费用和信用损失？"
threshold_policy = "same_fixed_goal_for_all_grid_cases"

[checks]
accounting = ["勾稽战略投资损益与 GAAP/non-GAAP 调节表，不能只按每股收益判断主营经营。", "区分 TPV、净收入和交易费用；披露为合计的交易及信用损失不能无依据拆分。", "经营现金流中的股票薪酬加回不等于股东没有稀释成本。"]
point_in_time = ["保留当时 non-GAAP 定义，不能带入 2024 年才公开的重编序列。"]
execution = ["不把公司回购作为交易账户现金流，历史成交使用原始开盘价。"]
automation_status = "review_requirements_not_all_implemented_as_scores"

