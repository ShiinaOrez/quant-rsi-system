[hypothesis]
title = "两种利润率的背离"
question = "营业利润率与交易利润率变化不一致时，费用构成能否解释差异？如何核对重组调整、股票薪酬和应收款对现金流的影响？"
threshold_policy = "same_fixed_goal_for_all_grid_cases"

[checks]
